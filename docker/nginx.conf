server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers: CSP and no framing. ${CONVEX_URL}, ${CONVEX_WS_URL} and ${CONVEX_SITE_URL} are filled in at
  # container start (nginx templates; CONVEX_WS_URL comes from docker/convex-ws-url.envsh).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob: http://127.0.0.1:3210 http://localhost:3210 ${CONVEX_URL}; connect-src 'self' http://127.0.0.1:3210 ws://127.0.0.1:3210 http://127.0.0.1:3211 http://localhost:3210 ws://localhost:3210 ${CONVEX_URL} ${CONVEX_WS_URL} ${CONVEX_SITE_URL} wss://api.cartesia.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;

  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; }
}
